---
name: "LFX V2 Personal Access Token Service Build"

"on":
  pull_request:

permissions:
  contents: read

jobs:
  build-pr:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download Dependencies
        run: make deps

      # Release builds compile the committed gen/, so CI must test those exact bytes.
      - name: Verify generated code is up to date
        run: make verify

      - name: Build
        run: make build

      - name: Test
        run: make test
