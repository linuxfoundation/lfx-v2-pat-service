---
name: "LFX V2 Personal Access Token Service Build"

"on":
  pull_request:

permissions:
  contents: read

jobs:
  build-pr:
    name: Build and Test
    runs-on: ubuntu-latest

    # The live database tests run against this service; they fail (not skip) on CI when it is missing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pat
          POSTGRES_PASSWORD: pat
          POSTGRES_DB: pat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5
        with:
          go-version-file: go.mod

      - name: Download Dependencies
        run: make deps

      - name: Generate service code
        run: make apigen

      - name: Build
        run: make build

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://pat:pat@localhost:5432/pat?sslmode=disable
        run: make test
