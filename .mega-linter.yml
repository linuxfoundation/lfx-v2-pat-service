---
GITHUB_COMMENT_REPORTER: false
DISABLE_LINTERS:
  # We are setting KUBERNETES_DIRECTORY to the helm chart so the
  # KUBERNETES_HELM linter can find the chart, but then this linter expects to
  # find raw Kubernetes manifests in this directory, which isn't the case.
  # If we added a PRE_ command with a `helm template` step, and further
  # restricted the included files for this linter, it *might* work.
  - KUBERNETES_KUBECONFORM
  # TBD how to use this from Megalinter with our setup.
  - KUBERNETES_KUBESCAPE
  # Repository-wide link checking returns mostly false positives (like internal
  # service URLs in templates).
  - SPELL_LYCHEE
  - SPELL_CSPELL
  # yamllint is sufficient for us.
  - YAML_PRETTIER
  # golangci-lint loads this Go 1.27 module but reports findings in existing
  # code: gocritic exitAfterDefer in cmd/pat-api/main.go, gofmt in
  # internal/infrastructure/config/config_test.go, and staticcheck SA1019 on
  # otel log/global in pkg/telemetry/otel.go. Re-enable once those are fixed.
  - GO_GOLANGCI_LINT
DISABLE_ERRORS_LINTERS:
  # This may be informative but doesn't need to break the build.
  - COPYPASTE_JSCPD
  # TBD! Need to work through these.
  - REPOSITORY_TRIVY
  - REPOSITORY_CHECKOV
  - REPOSITORY_DEVSKIM
# Only scan commits introduced by the PR. MegaLinter requires VALIDATE_ALL_CODEBASE
# false together with REPOSITORY_BETTERLEAKS_PR_COMMITS_SCAN, otherwise betterleaks
# still walks full history (example secrets on other branches).
VALIDATE_ALL_CODEBASE: false
REPOSITORY_BETTERLEAKS_PR_COMMITS_SCAN: true
# betterleaks' git scan needs the workspace marked as a git safe.directory.
# The workflow sets these GIT_CONFIG_* variables; pass them to betterleaks.
REPOSITORY_BETTERLEAKS_UNSECURED_ENV_VARIABLES:
  - GIT_CONFIG_COUNT
  - GIT_CONFIG_KEY_0
  - GIT_CONFIG_VALUE_0
COPYPASTE_JSCPD_CONFIG_FILE: .jscpd.json
YAML_YAMLLINT_CONFIG_FILE: .yamllint
# zizmor's online audits (ref-version-mismatch, impostor-commit,
# known-vulnerable-actions) call the GitHub API, which requires GITHUB_TOKEN.
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN
SPELL_CSPELL_ANALYZE_FILE_NAMES: false
# Make sure Vale is setup to run with the styles it needs.
SPELL_VALE_PRE_COMMANDS:
  - command: mkdir -p styles
    cwd: "workspace"
  - command: vale sync
    cwd: "workspace"
API_SPECTRAL_FILTER_REGEX_EXCLUDE: "gen/"
# Ignore YAML files with templating macros; these typically fail linting and/or
# schema checking.
FILTER_REGEX_EXCLUDE: '(templates/.*\.yml|templates/.*\.yaml|gen/.*)'
KUBERNETES_DIRECTORY: charts/lfx-v2-pat-service/templates
KUBERNETES_HELM_ARGUMENTS: charts/lfx-v2-pat-service
