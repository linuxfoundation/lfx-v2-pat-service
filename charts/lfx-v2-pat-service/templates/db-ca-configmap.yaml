{{- $ca := .Values.database.caBundle }}
{{- if and (eq .Values.database.store "postgres") (ne $ca.pem "") (not $ca.existingConfigMap) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-db-ca
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
data:
  {{ $ca.key }}: |
    {{- $ca.pem | nindent 4 }}
{{- end }}
