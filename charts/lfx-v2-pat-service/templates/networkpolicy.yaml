{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Chart.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The gateway and the kubelet probes reach the service port from anywhere in the cluster.
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Postgres. RDS sits outside the cluster, so the port is allowed to any destination.
    - ports:
        - port: {{ .Values.networkPolicy.postgresPort }}
          protocol: TCP
    # Heimdall: only the JWKS endpoint; the ForwardAuth port is used by Traefik, not by this pod.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.heimdallNamespace }}
      ports:
        - port: {{ .Values.networkPolicy.heimdallJWKSPort }}
          protocol: TCP
    # OpenTelemetry collector (gRPC and HTTP)
    - ports:
        - port: {{ .Values.networkPolicy.otelGRPCPort }}
          protocol: TCP
        - port: {{ .Values.networkPolicy.otelHTTPPort }}
          protocol: TCP
{{- end }}
