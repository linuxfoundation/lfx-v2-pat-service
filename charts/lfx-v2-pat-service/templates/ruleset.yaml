---
{{- if .Values.heimdall.enabled }}
apiVersion: heimdall.dadrus.github.com/v1alpha4
kind: RuleSet
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  # The token routes end in allow_all because there is no OpenFGA type for tokens: ownership is enforced by the
  # service, which scopes every read and revoke to the principal in the JWT, and refuses machine principals
  # ("<client_id>@clients") there. The anonymous fallback still produces a JWT (principal "_anonymous"), which
  # the service refuses on every route except the public OpenAPI document. The validate route is the one place
  # the gateway authorizes: only members of the validator team (app.validatorTeamName) may call it.
  rules:
    - id: "rule:lfx:lfx-v2-pat-service:openapi:get"
      allow_encoded_slashes: 'off'
      match:
        methods:
          - GET
        routes:
          - path: /_tokens/openapi3.json
      execute:
        - authenticator: oidc
        - authenticator: anonymous_authenticator
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience | quote }}

    - id: "rule:lfx:lfx-v2-pat-service:tokens:list"
      allow_encoded_slashes: 'off'
      match:
        methods:
          - GET
        routes:
          - path: /tokens
      execute:
        - authenticator: oidc
        - authenticator: anonymous_authenticator
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience | quote }}

    - id: "rule:lfx:lfx-v2-pat-service:tokens:create"
      allow_encoded_slashes: 'off'
      match:
        methods:
          - POST
        routes:
          - path: /tokens
      execute:
        - authenticator: oidc
        - authenticator: anonymous_authenticator
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: json_content_type
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            # The platform claims plus user_id, the Auth0 sub, which the service stores so the token exchange can sign in
            # as the owner. Keep the shared part in step with the platform's create_jwt finalizer.
            claims: |
              {{- .Files.Get "files/create-token-claims.tmpl" | nindent 14 }}
            values:
              aud: {{ .Values.app.audience | quote }}

    - id: "rule:lfx:lfx-v2-pat-service:tokens:delete"
      allow_encoded_slashes: 'off'
      match:
        methods:
          - DELETE
        routes:
          - path: /tokens/:uid
      execute:
        - authenticator: oidc
        - authenticator: anonymous_authenticator
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience | quote }}

    - id: "rule:lfx:lfx-v2-pat-service:tokens:validate"
      allow_encoded_slashes: 'off'
      match:
        methods:
          - POST
        routes:
          - path: /_tokens/validate
      execute:
        - authenticator: oidc
        - authenticator: anonymous_authenticator
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: json_content_type
        {{- if .Values.openfga.enabled }}
        {{/*
          Machine-to-machine endpoint (the Auth0 Custom Token Exchange action): callers must be members of
          the validator team (least privilege; the team's member tuples must exist in the environment's
          OpenFGA store, otherwise every caller is denied).
        */}}
        - authorizer: openfga_check
          config:
            values:
              relation: member
              object: "team:{{ required "app.validatorTeamName must be set when openfga.enabled is true" (.Values.app.validatorTeamName | trim) }}"
        {{- else }}
        {{/*
          When OpenFGA is disabled, allow all requests.
          (Only meant for *local development* because OpenFGA should be enabled when deployed.)
        */}}
        - authorizer: allow_all
        {{- end }}
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience | quote }}
{{- end }}
