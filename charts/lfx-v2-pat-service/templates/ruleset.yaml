---
{{- if .Values.heimdall.enabled }}
apiVersion: heimdall.dadrus.github.com/v1alpha4
kind: RuleSet
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  # Every rule ends in allow_all because there is no OpenFGA type for tokens: ownership is enforced by the
  # service, which scopes every read and revoke to the principal in the JWT. The anonymous fallback still
  # produces a JWT (principal "_anonymous"), which the service refuses, and machine principals
  # ("<client_id>@clients") are refused on the token routes and allow-listed on validate. See the service's
  # JWTAuth for the policy the gateway delegates.
  rules:
    - id: "rule:lfx:lfx-v2-pat-service:openapi:get"
      allow_encoded_slashes: 'off'
      match:
        methods:
          - GET
        routes:
          - path: /_tokens/openapi3.json
      execute:
        - authenticator: oidc
        - authenticator: anonymous_authenticator
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}

    - id: "rule:lfx:lfx-v2-pat-service:tokens:list"
      allow_encoded_slashes: 'off'
      match:
        methods:
          - GET
        routes:
          - path: /tokens
      execute:
        - authenticator: oidc
        - authenticator: anonymous_authenticator
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}

    - id: "rule:lfx:lfx-v2-pat-service:tokens:create"
      allow_encoded_slashes: 'off'
      match:
        methods:
          - POST
        routes:
          - path: /tokens
      execute:
        - authenticator: oidc
        - authenticator: anonymous_authenticator
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: json_content_type
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}

    - id: "rule:lfx:lfx-v2-pat-service:tokens:get"
      allow_encoded_slashes: 'off'
      match:
        methods:
          - GET
        routes:
          - path: /tokens/:uid
      execute:
        - authenticator: oidc
        - authenticator: anonymous_authenticator
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}

    - id: "rule:lfx:lfx-v2-pat-service:tokens:delete"
      allow_encoded_slashes: 'off'
      match:
        methods:
          - DELETE
        routes:
          - path: /tokens/:uid
      execute:
        - authenticator: oidc
        - authenticator: anonymous_authenticator
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}

    - id: "rule:lfx:lfx-v2-pat-service:tokens:validate"
      allow_encoded_slashes: 'off'
      match:
        methods:
          - POST
        routes:
          - path: /_tokens/validate
      execute:
        - authenticator: oidc
        - authenticator: anonymous_authenticator
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: json_content_type
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}
{{- end }}
