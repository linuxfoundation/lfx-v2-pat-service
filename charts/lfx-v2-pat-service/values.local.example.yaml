---
# Local development values override file.
# Copy this file to values.local.yaml and customize as needed.
# values.local.yaml is gitignored so your local settings won't be committed.
#
# Usage:
#   cp charts/lfx-v2-pat-service/values.local.example.yaml \
#      charts/lfx-v2-pat-service/values.local.yaml
#   make helm-install-local

# Image configuration
image:
  repository: ghcr.io/linuxfoundation/lfx-v2-pat-service/pat-api
  tag: "latest"  # Overrides appVersion from Chart.yaml
  pullPolicy: Never

app:
  # Skip JWT verification and act as this user.
  jwtAuthDisabledMockLocalPrincipal: alice
  # Let the same mock principal call POST /_tokens/validate.
  validatorPrincipals: alice

database:
  # The in-memory store needs no database. To exercise Postgres locally, set store: postgres and mode: local,
  # and point database.local at a Postgres reachable from the cluster.
  store: memory

networkPolicy:
  enabled: false
