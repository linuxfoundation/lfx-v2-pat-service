---
# image is the configuration for the container images
image:
  # repository is the container image repository
  repository: ghcr.io/linuxfoundation/lfx-v2-pat-service/pat-api
  # tag is the container image tag (overrides appVersion from Chart.yaml)
  tag: ""
  # pullPolicy is the image pull policy
  pullPolicy: IfNotPresent

# imagePullSecrets are the registry credentials used to pull the image.
# Example:
#   - name: linuxfoundation-imagepull
imagePullSecrets: []

# replicaCount is the number of replicas for the deployment
replicaCount: 1

# podAnnotations are additional annotations applied to the pod template.
# Example:
#   prometheus.io/scrape: "true"
#   prometheus.io/port: "8080"
podAnnotations: {}

# podLabels are additional labels applied to the pod template.
# Example:
#   team: platform
#   environment: production
podLabels: {}

# podDisruptionBudget configures a PodDisruptionBudget for the deployment.
# Only one of minAvailable or maxUnavailable may be set (not both).
podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

# resources is the configuration for container resource requests and limits
resources:
  # limits is the maximum amount of resources allowed
  limits:
    cpu: 500m
    memory: 512Mi
  # requests is the minimum amount of resources required
  requests:
    cpu: 100m
    memory: 128Mi

# traefik is the configuration for Traefik Gateway API routing
traefik:
  # gateway specifies the platform Gateway to attach to
  gateway:
    # name is the name of the Gateway resource
    name: lfx-platform-gateway
    # namespace is the namespace of the Gateway resource
    namespace: lfx

# lfx is the configuration for LFX platform
lfx:
  # domain is the base domain for routing
  domain: k8s.orb.local
  # namespace is the target namespace for deployment
  namespace: lfx

# service is the configuration for the Kubernetes service
service:
  # port is the service port
  port: 8080

# openfga is the configuration for the OpenFGA server
openfga:
  # enabled is a boolean to determine if the OpenFGA server should be enabled for authorization
  # Note: If it is disabled, then the validate route allows every authenticated caller
  # (Disabling OpenFGA should only be used for local development).
  enabled: true

# heimdall is the configuration for the heimdall middleware
heimdall:
  enabled: true
  url: http://lfx-platform-heimdall.lfx.svc.cluster.local:4456
  # add_middleware determines whether or not the middleware is installed. If not managed
  # by another service or helm chart then it is needed.
  add_middleware: false

# app is the configuration for the application
app:
  # audience is the "aud" claim Heimdall's create_jwt finalizer stamps on the JWT it forwards, and the value the
  # service requires. It appears in the RuleSet and the AUDIENCE env var.
  audience: lfx-v2-pat-service
  # issuer is the "iss" claim the service requires on the Heimdall-issued JWT.
  issuer: heimdall
  # jwksUrl is the endpoint the service fetches Heimdall's signing keys from.
  jwksUrl: http://lfx-platform-heimdall.lfx.svc.cluster.local:4457/.well-known/jwks
  # use_oidc_contextualizer adds the caller's verified email to the JWT; the service stores it on tokens it
  # issues for display and audit.
  use_oidc_contextualizer: true
  # jwtAuthDisabledMockLocalPrincipal disables JWT verification and attributes every request to this principal.
  # Local development only; leave empty everywhere else.
  jwtAuthDisabledMockLocalPrincipal: ""
  # validatorTeamName is the OpenFGA team whose members may call POST /_tokens/validate (the Auth0 Actions
  # client per environment, as "user:<client_id>@clients"). The name is env-invariant; the team exists once its
  # member tuples are written in the environment's OpenFGA store, and until then the route denies every caller.
  validatorTeamName: "pat_validator"
  # maxActivePerAudience bounds the active tokens one user may hold per audience.
  maxActivePerAudience: 25
  # logLevel is debug, info, warn or error.
  logLevel: info
  # logAddSource adds the source location to log lines.
  logAddSource: "true"

  # extraEnv allows injecting additional environment variables into the container.
  # Supports both simple key-value pairs and Kubernetes field references.
  # These are rendered BEFORE OTEL variables, allowing use in OTEL configuration.
  extraEnv: []

  # otel is the configuration for OpenTelemetry tracing
  otel:
    # serviceName is the service name for OpenTelemetry resource identification
    # (default: "lfx-v2-pat-service")
    serviceName: ""
    # serviceVersion is the service version for OpenTelemetry resource identification
    # (default: build-time Version variable)
    serviceVersion: ""
    # protocol specifies the OTLP protocol: "grpc" or "http"
    # (default: "grpc")
    protocol: "grpc"
    # endpoint is the OTLP collector endpoint
    # For gRPC: typically "host:4317", for HTTP: typically "host:4318"
    endpoint: ""
    # insecure disables TLS for the OTLP connection
    # Set to "true" for in-cluster communication without TLS
    insecure: "false"
    # tracesExporter specifies the traces exporter: "otlp" or "none"
    # (default: "none")
    tracesExporter: "none"
    # tracesSampleRatio specifies the sampling ratio for traces (0.0 to 1.0)
    # A value of 1.0 means all traces are sampled, 0.5 means 50% are sampled
    # (default: "1.0")
    tracesSampleRatio: "1.0"
    # metricsExporter specifies the metrics exporter: "otlp" or "none"
    # (default: "none")
    metricsExporter: "none"
    # logsExporter specifies the logs exporter: "otlp" or "none"
    # (default: "none")
    logsExporter: "none"
    # propagators specifies the trace context propagators to use
    # Comma-separated list of: "tracecontext", "baggage", "jaeger"
    # (default: "tracecontext,baggage")
    propagators: "tracecontext,baggage,jaeger"

# database configures the token store. Migrations are embedded in the binary and applied at startup, so the
# service only needs an empty database it owns.
database:
  # store is "postgres" (every deployed environment) or "memory", an in-memory store for local runs that
  # persists nothing and needs no database.
  store: postgres
  # mode selects where the Postgres credentials come from:
  #   "external" reads the five PG* variables from a Kubernetes Secret, the RDS credential that
  #              lfx-v2-opentofu provisions and the ArgoCD ExternalSecret materialises.
  #   "local"    uses the plain values below. Local development only.
  mode: external
  # sslmode is the libpq SSL mode. verify-full checks the server certificate chain and host name; every
  # weaker mode (require included) encrypts without authenticating the server, so the chart and the service
  # refuse them unless allowInsecureSSLMode is true.
  sslmode: verify-full
  # allowInsecureSSLMode permits an sslmode weaker than verify-full. Local development only.
  allowInsecureSSLMode: false
  # caBundle overrides the CA that signs the database server certificate. Without it the service trusts the AWS
  # RDS us-west-2 bundle shipped in the image (certs/, refreshed with make rds-ca). Set one of the two sources
  # below for a database outside that bundle; the file is mounted read-only and passed as PGSSLROOTCERT.
  caBundle:
    # pem is the PEM bundle inline (for RDS, the regional or global bundle AWS publishes); the chart renders it
    # into a ConfigMap.
    pem: ""
    # existingConfigMap names a ConfigMap that already holds the bundle; it takes precedence over pem.
    existingConfigMap: ""
    # key is the ConfigMap key holding the bundle.
    key: ca.pem
  # migrateOnStart applies pending migrations before the service listens.
  migrateOnStart: true
  # maxConns is the pgx pool size.
  maxConns: 10
  external:
    # secretName is the Secret holding the credential, the ArgoCD ExternalSecret target.
    secretName: lfx-v2-pat-service-secrets
    # keys maps each PG* variable to a key of that Secret.
    keys:
      host: host
      port: port
      username: username
      password: password
      dbname: dbname
  local:
    host: postgres
    port: "5432"
    user: pat
    password: pat
    dbname: pat

# networkPolicy restricts egress to what the service needs: DNS, Postgres (RDS sits outside the cluster, so
# the port is allowed to any destination), Heimdall's JWKS endpoint, and the OpenTelemetry collector.
networkPolicy:
  enabled: true
  postgresPort: 5432
  heimdallNamespace: lfx
  heimdallJWKSPort: 4457
  otelGRPCPort: 4317
  otelHTTPPort: 4318

# serviceAccount is the configuration for the Kubernetes service account (used by multiple components)
serviceAccount:
  # create specifies whether a service account should be created
  create: true
  # name is the name of the service account to use.
  # If not set and create is true, defaults to the chart name.
  name: ""
  # annotations to add to the service account
  annotations: {}
  # automountServiceAccountToken is a boolean to determine if the service account token should be automatically mounted
  automountServiceAccountToken: true
