swagger: "2.0"
info:
    title: LFX V2 Personal Access Token Service
    description: Issues, lists, revokes and validates audience-scoped personal access tokens.
    version: "1.0"
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /_tokens/validate:
        post:
            tags:
                - lfx_v2_pat_service
            summary: validate-token lfx_v2_pat_service
            description: 'Resolve a secret to its owner identity and record the use. Machine-to-machine: the gateway admits only members of the validator OpenFGA team. The caller must check the returned audience against the one it expects.'
            operationId: lfx_v2_pat_service#validate-token
            parameters:
                - name: v
                  in: query
                  description: Version of the API
                  required: false
                  type: string
                  enum:
                    - "1"
                - name: Authorization
                  in: header
                  description: JWT issued by Heimdall
                  required: false
                  type: string
                - name: Validate-TokenRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LfxV2PatServiceValidateTokenRequestBody'
                    required:
                        - secret
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/TokenIdentity'
                        required:
                            - uid
                            - username
                            - audience
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceValidateTokenBadRequestResponseBody'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceValidateTokenUnauthorizedResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceValidateTokenForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/InvalidTokenError'
                        required:
                            - error
                            - message
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceValidateTokenInternalServerErrorResponseBody'
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceValidateTokenServiceUnavailableResponseBody'
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /tokens:
        get:
            tags:
                - lfx_v2_pat_service
            summary: list-tokens lfx_v2_pat_service
            description: 'List the caller''s active tokens, newest first. Not paginated: the per-audience limit bounds the size.'
            operationId: lfx_v2_pat_service#list-tokens
            parameters:
                - name: v
                  in: query
                  description: Version of the API
                  required: false
                  type: string
                  enum:
                    - "1"
                - name: audience
                  in: query
                  description: Only return tokens minted for this audience
                  required: false
                  type: string
                  pattern: ^[a-z][a-z0-9-]{1,31}$
                - name: Authorization
                  in: header
                  description: JWT issued by Heimdall
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceListTokensResponseBody'
                        required:
                            - tokens
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceListTokensBadRequestResponseBody'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceListTokensUnauthorizedResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceListTokensForbiddenResponseBody'
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceListTokensInternalServerErrorResponseBody'
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceListTokensServiceUnavailableResponseBody'
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
        post:
            tags:
                - lfx_v2_pat_service
            summary: create-token lfx_v2_pat_service
            description: Create a token for the caller. The secret is returned once and is never retrievable again.
            operationId: lfx_v2_pat_service#create-token
            parameters:
                - name: v
                  in: query
                  description: Version of the API
                  required: false
                  type: string
                  enum:
                    - "1"
                - name: Authorization
                  in: header
                  description: JWT issued by Heimdall
                  required: false
                  type: string
                - name: Create-TokenRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LfxV2PatServiceCreateTokenRequestBody'
                    required:
                        - name
                        - audience
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceCreateTokenResponseBody'
                        required:
                            - secret
                            - token
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceCreateTokenBadRequestResponseBody'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceCreateTokenUnauthorizedResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceCreateTokenForbiddenResponseBody'
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/definitions/ConflictError'
                        required:
                            - error
                            - message
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceCreateTokenInternalServerErrorResponseBody'
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceCreateTokenServiceUnavailableResponseBody'
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /tokens/{uid}:
        delete:
            tags:
                - lfx_v2_pat_service
            summary: delete-token lfx_v2_pat_service
            description: Revoke one of the caller's tokens. The row is kept for audit; later reads return 404 and validation fails.
            operationId: lfx_v2_pat_service#delete-token
            parameters:
                - name: v
                  in: query
                  description: Version of the API
                  required: false
                  type: string
                  enum:
                    - "1"
                - name: uid
                  in: path
                  description: Token UID
                  required: true
                  type: string
                  format: uuid
                - name: Authorization
                  in: header
                  description: JWT issued by Heimdall
                  required: false
                  type: string
            responses:
                "204":
                    description: No Content response.
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceDeleteTokenBadRequestResponseBody'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceDeleteTokenUnauthorizedResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceDeleteTokenForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceDeleteTokenNotFoundResponseBody'
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceDeleteTokenInternalServerErrorResponseBody'
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceDeleteTokenServiceUnavailableResponseBody'
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
definitions:
    ConflictError:
        title: ConflictError
        type: object
        properties:
            error:
                type: string
                description: Stable machine-readable code
                example: token_name_taken
                enum:
                    - token_name_taken
                    - token_limit_reached
            message:
                type: string
                description: Human-readable explanation
                example: a token named "ci-pipeline" already exists for audience insights
        description: Name already used, or active-token limit reached, for this audience
        example:
            error: token_name_taken
            message: a token named "ci-pipeline" already exists for audience insights
        required:
            - error
            - message
    InvalidTokenError:
        title: InvalidTokenError
        type: object
        properties:
            error:
                type: string
                description: Stable machine-readable code
                example: invalid_token
                enum:
                    - invalid_token
            message:
                type: string
                description: Human-readable explanation
                example: secret is invalid or revoked
        description: Unknown, malformed, revoked, or disabled-audience secret
        example:
            error: invalid_token
            message: secret is invalid or revoked
        required:
            - error
            - message
    LfxV2PatServiceCreateTokenBadRequestResponseBody:
        title: 'Mediatype identifier: application/vnd.goa.error; view=default'
