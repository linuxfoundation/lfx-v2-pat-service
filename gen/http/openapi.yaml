swagger: "2.0"
info:
    title: LFX V2 Personal Access Token Service
    description: Issues, lists, revokes and validates audience-scoped personal access tokens.
    version: "1.0"
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /_tokens/validate:
        post:
            tags:
                - lfx_v2_pat_service
            summary: validate-token lfx_v2_pat_service
            description: 'Resolve a secret to its owner identity and record the use. Machine-to-machine: the gateway admits only members of the validator OpenFGA team. The caller must check the returned audience against the one it expects.'
            operationId: lfx_v2_pat_service#validate-token
            parameters:
                - name: v
                  in: query
                  description: Version of the API
                  required: false
                  type: string
                  enum:
                    - "1"
                - name: Authorization
                  in: header
                  description: JWT issued by Heimdall
                  required: false
                  type: string
                - name: Validate-TokenRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LfxV2PatServiceValidateTokenRequestBody'
                    required:
                        - secret
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/TokenIdentity'
                        required:
                            - uid
                            - username
                            - audience
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/BadRequestError'
                        required:
                            - error
                            - message
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - error
                            - message
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/ForbiddenError'
                        required:
                            - error
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/InvalidTokenError'
                        required:
                            - error
                            - message
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/InternalError'
                        required:
                            - error
                            - message
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/ServiceUnavailableError'
                        required:
                            - error
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /tokens:
        get:
            tags:
                - lfx_v2_pat_service
            summary: list-tokens lfx_v2_pat_service
            description: 'List the caller''s active tokens, newest first. Not paginated: the per-audience limit bounds the size.'
            operationId: lfx_v2_pat_service#list-tokens
            parameters:
                - name: v
                  in: query
                  description: Version of the API
                  required: false
                  type: string
                  enum:
                    - "1"
                - name: audience
                  in: query
                  description: Only return tokens minted for this audience
                  required: false
                  type: string
                  pattern: ^[a-z][a-z0-9-]{1,31}$
                - name: Authorization
                  in: header
                  description: JWT issued by Heimdall
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceListTokensResponseBody'
                        required:
                            - tokens
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/BadRequestError'
                        required:
                            - error
                            - message
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - error
                            - message
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/ForbiddenError'
                        required:
                            - error
                            - message
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/InternalError'
                        required:
                            - error
                            - message
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/ServiceUnavailableError'
                        required:
                            - error
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
        post:
            tags:
                - lfx_v2_pat_service
            summary: create-token lfx_v2_pat_service
            description: Create a token for the caller. The secret is returned once and is never retrievable again.
            operationId: lfx_v2_pat_service#create-token
            parameters:
                - name: v
                  in: query
                  description: Version of the API
                  required: false
                  type: string
                  enum:
                    - "1"
                - name: Authorization
                  in: header
                  description: JWT issued by Heimdall
                  required: false
                  type: string
                - name: Create-TokenRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LfxV2PatServiceCreateTokenRequestBody'
                    required:
                        - name
                        - audience
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/LfxV2PatServiceCreateTokenResponseBody'
                        required:
                            - secret
                            - token
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/BadRequestError'
                        required:
                            - error
                            - message
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - error
                            - message
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/ForbiddenError'
                        required:
                            - error
                            - message
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/definitions/ConflictError'
                        required:
                            - error
                            - message
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/InternalError'
                        required:
                            - error
                            - message
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/ServiceUnavailableError'
                        required:
                            - error
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /tokens/{uid}:
        delete:
            tags:
                - lfx_v2_pat_service
            summary: delete-token lfx_v2_pat_service
            description: Revoke one of the caller's tokens. The row is kept for audit; later reads return 404 and validation fails.
            operationId: lfx_v2_pat_service#delete-token
            parameters:
                - name: v
                  in: query
                  description: Version of the API
                  required: false
                  type: string
                  enum:
                    - "1"
                - name: uid
                  in: path
                  description: Token UID
                  required: true
                  type: string
                  format: uuid
                - name: Authorization
                  in: header
                  description: JWT issued by Heimdall
                  required: false
                  type: string
            responses:
                "204":
                    description: No Content response.
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/BadRequestError'
                        required:
                            - error
                            - message
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - error
                            - message
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/ForbiddenError'
                        required:
                            - error
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/NotFoundError'
                        required:
                            - error
                            - message
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/InternalError'
                        required:
                            - error
                            - message
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/ServiceUnavailableError'
                        required:
                            - error
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
definitions:
    BadRequestError:
        title: BadRequestError
        type: object
        properties:
            error:
                type: string
                description: Stable machine-readable code
                example: invalid_request
                enum:
                    - invalid_request
                    - invalid_name
                    - invalid_uid
                    - unknown_audience
            message:
                type: string
                description: Human-readable explanation
                example: value of version must be one of "1" but got value "2"
        description: Invalid name, or unknown or disabled audience
        example:
            error: invalid_request
            message: value of version must be one of "1" but got value "2"
        required:
            - error
            - message
    ConflictError:
        title: ConflictError
        type: object
        properties:
            error:
                type: string
                description: Stable machine-readable code
                example: token_name_taken
                enum:
                    - token_name_taken
                    - token_limit_reached
            message:
                type: string
                description: Human-readable explanation
                example: a token named "ci-pipeline" already exists for audience insights
        description: Name already used, or active-token limit reached, for this audience
        example:
            error: token_name_taken
            message: a token named "ci-pipeline" already exists for audience insights
        required:
            - error
            - message
    ForbiddenError:
        title: ForbiddenError
        type: object
        properties:
            error:
                type: string
                description: Stable machine-readable code
                example: forbidden
                enum:
                    - forbidden
            message:
                type: string
                description: Human-readable explanation
                example: machine principals cannot manage personal access tokens
        description: Principal is not allowed to call this endpoint
        example:
            error: forbidden
            message: machine principals cannot manage personal access tokens
        required:
            - error
            - message
    InternalError:
        title: InternalError
        type: object
        properties:
            error:
                type: string
                description: Stable machine-readable code
                example: internal_error
                enum:
                    - internal_error
            message:
                type: string
                description: Human-readable explanation
                example: internal service error
        description: Internal server error
        example:
            error: internal_error
            message: internal service error
        required:
            - error
            - message
    InvalidTokenError:
        title: InvalidTokenError
        type: object
        properties:
            error:
                type: string
                description: Stable machine-readable code
                example: invalid_token
                enum:
                    - invalid_token
            message:
                type: string
                description: Human-readable explanation
                example: secret is invalid or revoked
        description: Unknown, malformed, revoked, or disabled-audience secret
        example:
            error: invalid_token
            message: secret is invalid or revoked
        required:
            - error
            - message
    LfxV2PatServiceCreateTokenRequestBody:
        title: LfxV2PatServiceCreateTokenRequestBody
        type: object
        properties:
            audience:
                type: string
                description: Audience to mint the token for
                example: insights
                pattern: ^[a-z][a-z0-9-]{1,31}$
            name:
                type: string
                description: Display name, unique (case-insensitive) among the caller's active tokens for the audience
                example: ci-pipeline
                minLength: 1
                maxLength: 100
        example:
            audience: insights
            name: ci-pipeline
        required:
            - name
            - audience
    LfxV2PatServiceCreateTokenResponseBody:
        title: LfxV2PatServiceCreateTokenResponseBody
        type: object
        properties:
            secret:
                type: string
                description: Plaintext secret. Shown once; store it now.
                example: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            token:
                $ref: '#/definitions/TokenResponse'
        example:
            secret: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            token:
                audience: insights
                created_at: "2026-09-21T12:00:00Z"
                last_used_at: "2026-09-22T08:30:00Z"
                lookup_id: Ab3kZ9QmT2xL
                name: ci-pipeline
                uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                username: jdoe
        required:
            - secret
            - token
    LfxV2PatServiceListTokensResponseBody:
        title: LfxV2PatServiceListTokensResponseBody
        type: object
        properties:
            tokens:
                type: array
                items:
                    $ref: '#/definitions/TokenResponse'
                description: Active tokens owned by the caller
                example:
                    - audience: insights
                      created_at: "2026-09-21T12:00:00Z"
                      last_used_at: "2026-09-22T08:30:00Z"
                      lookup_id: Ab3kZ9QmT2xL
                      name: ci-pipeline
                      uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                      username: jdoe
                    - audience: insights
                      created_at: "2026-09-21T12:00:00Z"
                      last_used_at: "2026-09-22T08:30:00Z"
                      lookup_id: Ab3kZ9QmT2xL
                      name: ci-pipeline
                      uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                      username: jdoe
                    - audience: insights
                      created_at: "2026-09-21T12:00:00Z"
                      last_used_at: "2026-09-22T08:30:00Z"
                      lookup_id: Ab3kZ9QmT2xL
                      name: ci-pipeline
                      uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                      username: jdoe
        example:
            tokens:
                - audience: insights
                  created_at: "2026-09-21T12:00:00Z"
                  last_used_at: "2026-09-22T08:30:00Z"
                  lookup_id: Ab3kZ9QmT2xL
                  name: ci-pipeline
                  uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                  username: jdoe
                - audience: insights
                  created_at: "2026-09-21T12:00:00Z"
                  last_used_at: "2026-09-22T08:30:00Z"
                  lookup_id: Ab3kZ9QmT2xL
                  name: ci-pipeline
                  uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                  username: jdoe
                - audience: insights
                  created_at: "2026-09-21T12:00:00Z"
                  last_used_at: "2026-09-22T08:30:00Z"
                  lookup_id: Ab3kZ9QmT2xL
                  name: ci-pipeline
                  uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                  username: jdoe
        required:
            - tokens
    LfxV2PatServiceValidateTokenRequestBody:
        title: LfxV2PatServiceValidateTokenRequestBody
        type: object
        properties:
            secret:
                type: string
                description: Opaque secret presented by the end user
                example: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                minLength: 1
                maxLength: 128
        example:
            secret: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        required:
            - secret
    NotFoundError:
        title: NotFoundError
        type: object
        properties:
            error:
                type: string
                description: Stable machine-readable code
                example: token_not_found
                enum:
                    - token_not_found
            message:
                type: string
                description: Human-readable explanation
                example: no active token with this uid
        description: No active token with this uid is owned by the caller
        example:
            error: token_not_found
            message: no active token with this uid
        required:
            - error
            - message
    ServiceUnavailableError:
        title: ServiceUnavailableError
        type: object
        properties:
            error:
                type: string
                description: Stable machine-readable code
                example: service_unavailable
                enum:
                    - service_unavailable
            message:
                type: string
                description: Human-readable explanation
                example: the service is unavailable
        description: Service unavailable
        example:
            error: service_unavailable
            message: the service is unavailable
        required:
            - error
            - message
    TokenIdentity:
        title: TokenIdentity
        type: object
        properties:
            audience:
                type: string
                description: Audience the token was minted for. The caller must compare it with the audience it expects.
                example: insights
                pattern: ^[a-z][a-z0-9-]{1,31}$
            email:
                type: string
                description: Owner email captured at issuance, when the user JWT carried a verified one
                example: jdoe@example.com
                format: email
            uid:
                type: string
                description: Token UID
                example: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                format: uuid
            username:
                type: string
                description: Owner LFID username
                example: jdoe
        example:
            audience: insights
            email: jdoe@example.com
            uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
            username: jdoe
        required:
            - uid
            - username
            - audience
    TokenResponse:
        title: TokenResponse
        type: object
        properties:
            audience:
                type: string
                description: Audience the token was minted for
                example: insights
                pattern: ^[a-z][a-z0-9-]{1,31}$
            created_at:
                type: string
                description: Creation time
                example: "2026-09-21T12:00:00Z"
                format: date-time
            last_used_at:
                type: string
                description: Time of the last successful validation; absent until first use
                example: "2026-09-22T08:30:00Z"
                format: date-time
            lookup_id:
                type: string
                description: Public locator embedded in the secret; safe to display
                example: Ab3kZ9QmT2xL
                minLength: 12
                maxLength: 12
            name:
                type: string
                description: Display name, unique (case-insensitive) among the caller's active tokens for the audience
                example: ci-pipeline
                minLength: 1
                maxLength: 100
            uid:
                type: string
                description: Token UID
                example: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                format: uuid
            username:
                type: string
                description: Owner LFID username
                example: jdoe
        description: A personal access token as seen by its owner. The secret is only returned at creation.
        example:
            audience: insights
            created_at: "2026-09-21T12:00:00Z"
            last_used_at: "2026-09-22T08:30:00Z"
            lookup_id: Ab3kZ9QmT2xL
            name: ci-pipeline
            uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
            username: jdoe
        required:
            - uid
            - name
            - audience
            - lookup_id
            - username
            - created_at
    UnauthorizedError:
        title: UnauthorizedError
        type: object
        properties:
            error:
                type: string
                description: Stable machine-readable code
                example: unauthorized
                enum:
                    - unauthorized
            message:
                type: string
                description: Human-readable explanation
                example: missing bearer token
        description: Missing, invalid or anonymous bearer token
        example:
            error: unauthorized
            message: missing bearer token
        required:
            - error
            - message
securityDefinitions:
    jwt_header_Authorization:
        type: apiKey
        description: Heimdall authorization
        name: Authorization
        in: header
