    LfxV2PatServiceCreateTokenRequestBody:
        title: LfxV2PatServiceCreateTokenRequestBody
        type: object
        properties:
            audience:
                type: string
                description: Audience to mint the token for
                example: insights
                pattern: ^[a-z][a-z0-9-]{1,31}$
            name:
                type: string
                description: Display name, unique (case-insensitive) among the caller's active tokens for the audience
                example: ci-pipeline
                minLength: 1
                maxLength: 100
        example:
            audience: insights
            name: ci-pipeline
        required:
            - name
            - audience
    LfxV2PatServiceCreateTokenResponseBody:
        title: LfxV2PatServiceCreateTokenResponseBody
        type: object
        properties:
            secret:
                type: string
                description: Plaintext secret. Shown once; store it now.
                example: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            token:
                $ref: '#/definitions/TokenResponse'
        example:
            secret: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            token:
                audience: insights
                created_at: "2026-09-21T12:00:00Z"
                last_used_at: "2026-09-22T08:30:00Z"
                lookup_id: Ab3kZ9QmT2xL
                name: ci-pipeline
                uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                username: jdoe
        required:
