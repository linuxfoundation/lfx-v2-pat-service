    TokenIdentity:
        title: TokenIdentity
        type: object
        properties:
            audience:
                type: string
                description: Identifier of the Auth0 API the token was minted for. The caller must compare it with the audience it expects.
                example: https://api.example.org/
            email:
                type: string
                description: Owner email captured at issuance, when the user JWT carried a verified one
                example: jdoe@example.com
                format: email
            uid:
                type: string
                description: Owner's Auth0 user ID, captured at issuance
                example: auth0|jdoe
            username:
                type: string
                description: Owner LFID username
                example: jdoe
        example:
            audience: https://api.example.org/
            email: jdoe@example.com
            uid: auth0|jdoe
            username: jdoe
        required:
            - uid
            - username
            - audience
    TokenResponse:
        title: TokenResponse
        type: object
        properties:
            audience:
                type: string
                description: Audience the token was minted for
                example: insights
                pattern: ^[a-z][a-z0-9-]{1,31}$
            created_at:
                type: string
                description: Creation time
                example: "2026-09-21T12:00:00Z"
                format: date-time
            last_used_at:
                type: string
                description: Time of the last successful validation; absent until first use
                example: "2026-09-22T08:30:00Z"
                format: date-time
            lookup_id:
                type: string
                description: Public locator embedded in the secret; safe to display
                example: Ab3kZ9QmT2xL
                minLength: 12
                maxLength: 12
            name:
                type: string
                description: Display name, unique (case-insensitive) among the caller's active tokens for the audience
                example: ci-pipeline
                minLength: 1
                maxLength: 100
            uid:
                type: string
                description: Token UID
                example: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                format: uuid
            username:
                type: string
                description: Owner LFID username
                example: jdoe
        description: A personal access token as seen by its owner. The secret is only returned at creation.
        example:
            audience: insights
            created_at: "2026-09-21T12:00:00Z"
            last_used_at: "2026-09-22T08:30:00Z"
            lookup_id: Ab3kZ9QmT2xL
            name: ci-pipeline
            uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
            username: jdoe
        required:
            - uid
            - name
            - audience
            - lookup_id
            - username
            - created_at
