openapi: 3.0.3
info:
    title: LFX V2 Personal Access Token Service
    description: Issues, lists, revokes and validates audience-scoped personal access tokens.
    version: "1.0"
servers:
    - url: http://localhost:80
      description: Default server for lfx-v2-pat-service
paths:
    /_tokens/validate:
        post:
            tags:
                - lfx_v2_pat_service
            summary: validate-token lfx_v2_pat_service
            description: 'Resolve a secret to its owner identity and record the use. Machine-to-machine: the gateway admits only members of the validator OpenFGA team. The caller must check the returned audience against the one it expects.'
            operationId: lfx_v2_pat_service#validate-token
            parameters:
                - name: v
                  in: query
                  description: Version of the API
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Version of the API
                    example: "1"
                    enum:
                        - "1"
                  example: "1"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ValidateTokenRequestBody'
                        example:
                            secret: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenIdentity'
                            example:
                                audience: insights
                                email: jdoe@example.com
                                uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                                username: jdoe
                "400":
                    description: 'BadRequest: Malformed request body'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "401":
                    description: 'Unauthorized: Missing, invalid or anonymous bearer token'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "403":
                    description: 'Forbidden: Principal is not allowed to call this endpoint'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "404":
                    description: 'InvalidToken: Unknown, malformed, revoked, or disabled-audience secret'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvalidTokenError'
                            example:
                                error: invalid_token
                                message: secret is invalid or revoked
                "500":
                    description: 'InternalServerError: Internal server error'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "503":
                    description: 'ServiceUnavailable: Service unavailable'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
            security:
                - jwt_header_Authorization: []
    /tokens:
        get:
            tags:
                - lfx_v2_pat_service
            summary: list-tokens lfx_v2_pat_service
            description: 'List the caller''s active tokens, newest first. Not paginated: the per-audience limit bounds the size.'
            operationId: lfx_v2_pat_service#list-tokens
            parameters:
                - name: v
                  in: query
                  description: Version of the API
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Version of the API
                    example: "1"
                    enum:
                        - "1"
                  example: "1"
                - name: audience
                  in: query
                  description: Only return tokens minted for this audience
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Only return tokens minted for this audience
                    example: insights
                    pattern: ^[a-z][a-z0-9-]{1,31}$
                  example: insights
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListTokensResponseBody'
                            example:
                                tokens:
                                    - audience: insights
                                      created_at: "2026-09-21T12:00:00Z"
                                      last_used_at: "2026-09-22T08:30:00Z"
                                      lookup_id: Ab3kZ9QmT2xL
                                      name: ci-pipeline
                                      uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                                      username: jdoe
                                    - audience: insights
                                      created_at: "2026-09-21T12:00:00Z"
                                      last_used_at: "2026-09-22T08:30:00Z"
                                      lookup_id: Ab3kZ9QmT2xL
                                      name: ci-pipeline
                                      uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                                      username: jdoe
                                    - audience: insights
                                      created_at: "2026-09-21T12:00:00Z"
                                      last_used_at: "2026-09-22T08:30:00Z"
                                      lookup_id: Ab3kZ9QmT2xL
                                      name: ci-pipeline
                                      uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                                      username: jdoe
                "400":
                    description: 'BadRequest: Invalid filter'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "401":
                    description: 'Unauthorized: Missing, invalid or anonymous bearer token'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "403":
                    description: 'Forbidden: Principal is not allowed to call this endpoint'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "500":
                    description: 'InternalServerError: Internal server error'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "503":
                    description: 'ServiceUnavailable: Service unavailable'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
            security:
                - jwt_header_Authorization: []
        post:
            tags:
                - lfx_v2_pat_service
            summary: create-token lfx_v2_pat_service
            description: Create a token for the caller. The secret is returned once and is never retrievable again.
            operationId: lfx_v2_pat_service#create-token
            parameters:
                - name: v
                  in: query
                  description: Version of the API
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Version of the API
                    example: "1"
                    enum:
                        - "1"
                  example: "1"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateTokenRequestBody'
                        example:
                            audience: insights
                            name: ci-pipeline
            responses:
                "201":
                    description: Created response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateTokenResponseBody'
                            example:
                                secret: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                                token:
                                    audience: insights
                                    created_at: "2026-09-21T12:00:00Z"
                                    last_used_at: "2026-09-22T08:30:00Z"
                                    lookup_id: Ab3kZ9QmT2xL
                                    name: ci-pipeline
                                    uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                                    username: jdoe
                "400":
                    description: 'BadRequest: Invalid name, or unknown or disabled audience'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "401":
                    description: 'Unauthorized: Missing, invalid or anonymous bearer token'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "403":
                    description: 'Forbidden: Principal is not allowed to call this endpoint'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "409":
                    description: 'Conflict: Name already used, or active-token limit reached, for this audience'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConflictError'
                            example:
                                error: token_name_taken
                                message: a token named "ci-pipeline" already exists for audience insights
                "500":
                    description: 'InternalServerError: Internal server error'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "503":
                    description: 'ServiceUnavailable: Service unavailable'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
            security:
                - jwt_header_Authorization: []
    /tokens/{uid}:
        delete:
            tags:
                - lfx_v2_pat_service
            summary: delete-token lfx_v2_pat_service
            description: Revoke one of the caller's tokens. The row is kept for audit; later reads return 404 and validation fails.
            operationId: lfx_v2_pat_service#delete-token
            parameters:
                - name: v
                  in: query
                  description: Version of the API
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Version of the API
                    example: "1"
                    enum:
                        - "1"
                  example: "1"
                - name: uid
                  in: path
                  description: Token UID
                  required: true
                  schema:
                    type: string
                    description: Token UID
                    example: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                    format: uuid
                  example: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
            responses:
                "204":
                    description: No Content response.
                "400":
                    description: 'BadRequest: uid is not a UUID'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "401":
                    description: 'Unauthorized: Missing, invalid or anonymous bearer token'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "403":
                    description: 'Forbidden: Principal is not allowed to call this endpoint'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "404":
                    description: 'NotFound: No active token with this uid is owned by the caller'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "500":
                    description: 'InternalServerError: Internal server error'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "503":
                    description: 'ServiceUnavailable: Service unavailable'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
            security:
                - jwt_header_Authorization: []
        get:
            tags:
                - lfx_v2_pat_service
            summary: get-token lfx_v2_pat_service
            description: Get one of the caller's active tokens.
            operationId: lfx_v2_pat_service#get-token
            parameters:
                - name: v
                  in: query
                  description: Version of the API
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Version of the API
                    example: "1"
                    enum:
                        - "1"
                  example: "1"
                - name: uid
                  in: path
                  description: Token UID
                  required: true
                  schema:
                    type: string
                    description: Token UID
                    example: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                    format: uuid
                  example: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenResponse'
                            example:
                                audience: insights
                                created_at: "2026-09-21T12:00:00Z"
                                last_used_at: "2026-09-22T08:30:00Z"
                                lookup_id: Ab3kZ9QmT2xL
                                name: ci-pipeline
                                uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                                username: jdoe
                "400":
                    description: 'BadRequest: uid is not a UUID'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "401":
                    description: 'Unauthorized: Missing, invalid or anonymous bearer token'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "403":
                    description: 'Forbidden: Principal is not allowed to call this endpoint'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "404":
                    description: 'NotFound: No active token with this uid is owned by the caller'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "500":
                    description: 'InternalServerError: Internal server error'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "503":
                    description: 'ServiceUnavailable: Service unavailable'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
            security:
                - jwt_header_Authorization: []
components:
    schemas:
        ConflictError:
            type: object
            properties:
                error:
                    type: string
                    description: Stable machine-readable code
                    example: token_name_taken
                    enum:
                        - token_name_taken
                        - token_limit_reached
                message:
                    type: string
                    description: Human-readable explanation
                    example: a token named "ci-pipeline" already exists for audience insights
            description: Name already used, or active-token limit reached, for this audience
            example:
                error: token_name_taken
                message: a token named "ci-pipeline" already exists for audience insights
            required:
                - error
                - message
        CreateTokenRequestBody:
            type: object
            properties:
                audience:
                    type: string
                    description: Audience to mint the token for
                    example: insights
                    pattern: ^[a-z][a-z0-9-]{1,31}$
                name:
                    type: string
                    description: Display name, unique (case-insensitive) among the caller's active tokens for the audience
                    example: ci-pipeline
                    minLength: 1
                    maxLength: 100
            example:
                audience: insights
                name: ci-pipeline
            required:
                - name
                - audience
        CreateTokenResponseBody:
            type: object
            properties:
                secret:
                    type: string
                    description: Plaintext secret. Shown once; store it now.
                    example: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                token:
                    $ref: '#/components/schemas/TokenResponse'
            example:
                secret: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                token:
                    audience: insights
                    created_at: "2026-09-21T12:00:00Z"
                    last_used_at: "2026-09-22T08:30:00Z"
                    lookup_id: Ab3kZ9QmT2xL
                    name: ci-pipeline
                    uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                    username: jdoe
            required:
                - secret
                - token
        Error:
            type: object
            properties:
                fault:
                    type: boolean
                    description: Is the error a server-side fault?
                    example: false
                id:
                    type: string
                    description: ID is a unique identifier for this particular occurrence of the problem.
                    example: 123abc
                message:
                    type: string
                    description: Message is a human-readable explanation specific to this occurrence of the problem.
                    example: parameter 'p' must be an integer
                name:
                    type: string
                    description: Name is the name of this class of errors.
                    example: bad_request
                temporary:
                    type: boolean
                    description: Is the error temporary?
                    example: false
                timeout:
                    type: boolean
                    description: Is the error a timeout?
                    example: false
            description: Missing, invalid or anonymous bearer token
            example:
                fault: true
                id: 123abc
                message: parameter 'p' must be an integer
                name: bad_request
                temporary: true
                timeout: false
            required:
                - name
                - id
                - message
                - temporary
                - timeout
                - fault
        InvalidTokenError:
            type: object
            properties:
                error:
                    type: string
                    description: Stable machine-readable code
                    example: invalid_token
                    enum:
                        - invalid_token
                message:
                    type: string
                    description: Human-readable explanation
                    example: secret is invalid or revoked
            description: Secret is invalid or revoked
            example:
                error: invalid_token
                message: secret is invalid or revoked
            required:
                - error
                - message
        ListTokensResponseBody:
            type: object
            properties:
                tokens:
                    type: array
                    items:
                        $ref: '#/components/schemas/TokenResponse'
                    description: Active tokens owned by the caller
                    example:
                        - audience: insights
                          created_at: "2026-09-21T12:00:00Z"
                          last_used_at: "2026-09-22T08:30:00Z"
                          lookup_id: Ab3kZ9QmT2xL
                          name: ci-pipeline
                          uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                          username: jdoe
                        - audience: insights
                          created_at: "2026-09-21T12:00:00Z"
                          last_used_at: "2026-09-22T08:30:00Z"
                          lookup_id: Ab3kZ9QmT2xL
                          name: ci-pipeline
                          uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                          username: jdoe
                        - audience: insights
                          created_at: "2026-09-21T12:00:00Z"
                          last_used_at: "2026-09-22T08:30:00Z"
                          lookup_id: Ab3kZ9QmT2xL
                          name: ci-pipeline
                          uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                          username: jdoe
                        - audience: insights
                          created_at: "2026-09-21T12:00:00Z"
                          last_used_at: "2026-09-22T08:30:00Z"
                          lookup_id: Ab3kZ9QmT2xL
                          name: ci-pipeline
                          uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                          username: jdoe
            example:
                tokens:
                    - audience: insights
                      created_at: "2026-09-21T12:00:00Z"
                      last_used_at: "2026-09-22T08:30:00Z"
                      lookup_id: Ab3kZ9QmT2xL
                      name: ci-pipeline
                      uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                      username: jdoe
                    - audience: insights
                      created_at: "2026-09-21T12:00:00Z"
                      last_used_at: "2026-09-22T08:30:00Z"
                      lookup_id: Ab3kZ9QmT2xL
                      name: ci-pipeline
                      uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                      username: jdoe
                    - audience: insights
                      created_at: "2026-09-21T12:00:00Z"
                      last_used_at: "2026-09-22T08:30:00Z"
                      lookup_id: Ab3kZ9QmT2xL
                      name: ci-pipeline
                      uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                      username: jdoe
                    - audience: insights
                      created_at: "2026-09-21T12:00:00Z"
                      last_used_at: "2026-09-22T08:30:00Z"
                      lookup_id: Ab3kZ9QmT2xL
                      name: ci-pipeline
                      uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                      username: jdoe
            required:
                - tokens
        TokenIdentity:
            type: object
            properties:
                audience:
                    type: string
                    description: Audience the token was minted for. The caller must compare it with the audience it expects.
                    example: insights
                    pattern: ^[a-z][a-z0-9-]{1,31}$
                email:
                    type: string
                    description: Owner email captured at issuance, when the user JWT carried a verified one
                    example: jdoe@example.com
                    format: email
                uid:
                    type: string
                    description: Token UID
                    example: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                    format: uuid
                username:
                    type: string
                    description: Owner LFID username
                    example: jdoe
            description: Owner identity resolved from a secret
            example:
                audience: insights
                email: jdoe@example.com
                uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                username: jdoe
            required:
                - uid
                - username
                - audience
        TokenResponse:
            type: object
            properties:
                audience:
                    type: string
                    description: Audience the token was minted for
                    example: insights
                    pattern: ^[a-z][a-z0-9-]{1,31}$
                created_at:
                    type: string
                    description: Creation time
                    example: "2026-09-21T12:00:00Z"
                    format: date-time
                last_used_at:
                    type: string
                    description: Time of the last successful validation; absent until first use
                    example: "2026-09-22T08:30:00Z"
                    format: date-time
                lookup_id:
                    type: string
                    description: Public locator embedded in the secret; safe to display
                    example: Ab3kZ9QmT2xL
                    minLength: 12
                    maxLength: 12
                name:
                    type: string
                    description: Display name, unique (case-insensitive) among the caller's active tokens for the audience
                    example: ci-pipeline
                    minLength: 1
                    maxLength: 100
                uid:
                    type: string
                    description: Token UID
                    example: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                    format: uuid
                username:
                    type: string
                    description: Owner LFID username
                    example: jdoe
            description: A personal access token as seen by its owner. The secret is only returned at creation.
            example:
                audience: insights
                created_at: "2026-09-21T12:00:00Z"
                last_used_at: "2026-09-22T08:30:00Z"
                lookup_id: Ab3kZ9QmT2xL
                name: ci-pipeline
                uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                username: jdoe
            required:
                - uid
                - name
                - audience
                - lookup_id
                - username
                - created_at
        ValidateTokenRequestBody:
            type: object
            properties:
                secret:
                    type: string
                    description: Opaque secret presented by the end user
                    example: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                    minLength: 1
                    maxLength: 128
            example:
                secret: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            required:
                - secret
    securitySchemes:
        jwt_header_Authorization:
            type: http
            description: Heimdall authorization
            scheme: bearer
tags:
    - name: lfx_v2_pat_service
      description: LFX V2 Personal Access Token Service
