openapi: 3.0.3
info:
    title: LFX V2 Personal Access Token Service
    description: Issues, lists, revokes and validates audience-scoped personal access tokens.
    version: "1.0"
servers:
    - url: http://localhost:80
      description: Default server for lfx-v2-pat-service
paths:
    /_tokens/validate:
        post:
            tags:
                - lfx_v2_pat_service
            summary: validate-token lfx_v2_pat_service
            description: 'Resolve a secret to its owner identity and record the use. Machine-to-machine: the gateway admits only members of the validator OpenFGA team. The caller must check the returned audience against the one it expects.'
            operationId: lfx_v2_pat_service#validate-token
            parameters:
                - name: v
                  in: query
                  description: Version of the API
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Version of the API
                    example: "1"
                    enum:
                        - "1"
                  example: "1"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ValidateTokenRequestBody'
                        example:
                            secret: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenIdentity'
                            example:
                                audience: insights
                                email: jdoe@example.com
                                uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                                username: jdoe
                "400":
                    description: 'BadRequest: Malformed request body'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BadRequestError'
                            example:
                                error: invalid_request
                                message: value of version must be one of "1" but got value "2"
                "401":
                    description: 'Unauthorized: Missing, invalid or anonymous bearer token'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedError'
                            example:
                                error: unauthorized
                                message: missing bearer token
                "403":
                    description: 'Forbidden: Principal is not allowed to call this endpoint'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenError'
                            example:
                                error: forbidden
                                message: machine principals cannot manage personal access tokens
                "404":
                    description: 'InvalidToken: Unknown, malformed, expired, revoked, or disabled-audience secret'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvalidTokenError'
                            example:
                                error: invalid_token
                                message: secret is invalid, expired or revoked
                "500":
                    description: 'InternalServerError: Internal server error'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InternalError'
                            example:
                                error: internal_error
                                message: internal service error
                "503":
                    description: 'ServiceUnavailable: Service unavailable'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ServiceUnavailableError'
                            example:
                                error: service_unavailable
                                message: the service is unavailable
            security:
                - jwt_header_Authorization: []
    /tokens:
        get:
            tags:
                - lfx_v2_pat_service
            summary: list-tokens lfx_v2_pat_service
            description: 'List the caller''s active tokens, newest first. Expired tokens stay listed until revoked. Not paginated: the per-audience limit bounds the size.'
            operationId: lfx_v2_pat_service#list-tokens
            parameters:
                - name: v
                  in: query
                  description: Version of the API
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Version of the API
                    example: "1"
                    enum:
                        - "1"
                  example: "1"
                - name: audience
                  in: query
                  description: Only return tokens minted for this audience
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Only return tokens minted for this audience
                    example: insights
                    pattern: ^[a-z][a-z0-9-]{1,31}$
                  example: insights
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListTokensResponseBody'
                            example:
                                tokens:
                                    - audience: insights
                                      created_at: "2026-09-21T12:00:00Z"
                                      expires_at: "2026-12-20T12:00:00Z"
                                      last_used_at: "2026-09-22T08:30:00Z"
                                      lookup_id: Ab3kZ9QmT2xL
                                      name: ci-pipeline
                                      uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                                      username: jdoe
                                    - audience: insights
                                      created_at: "2026-09-21T12:00:00Z"
                                      expires_at: "2026-12-20T12:00:00Z"
                                      last_used_at: "2026-09-22T08:30:00Z"
                                      lookup_id: Ab3kZ9QmT2xL
                                      name: ci-pipeline
                                      uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                                      username: jdoe
                                    - audience: insights
                                      created_at: "2026-09-21T12:00:00Z"
                                      expires_at: "2026-12-20T12:00:00Z"
                                      last_used_at: "2026-09-22T08:30:00Z"
                                      lookup_id: Ab3kZ9QmT2xL
                                      name: ci-pipeline
                                      uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                                      username: jdoe
                "400":
                    description: 'BadRequest: Invalid filter'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BadRequestError'
                            example:
                                error: invalid_request
                                message: value of version must be one of "1" but got value "2"
                "401":
                    description: 'Unauthorized: Missing, invalid or anonymous bearer token'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedError'
                            example:
                                error: unauthorized
                                message: missing bearer token
                "403":
                    description: 'Forbidden: Principal is not allowed to call this endpoint'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenError'
                            example:
                                error: forbidden
                                message: machine principals cannot manage personal access tokens
                "500":
                    description: 'InternalServerError: Internal server error'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InternalError'
                            example:
                                error: internal_error
                                message: internal service error
                "503":
                    description: 'ServiceUnavailable: Service unavailable'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ServiceUnavailableError'
                            example:
                                error: service_unavailable
                                message: the service is unavailable
            security:
                - jwt_header_Authorization: []
        post:
            tags:
                - lfx_v2_pat_service
            summary: create-token lfx_v2_pat_service
            description: Create a token for the caller. The secret is returned once and is never retrievable again.
            operationId: lfx_v2_pat_service#create-token
            parameters:
                - name: v
                  in: query
                  description: Version of the API
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Version of the API
                    example: "1"
                    enum:
                        - "1"
                  example: "1"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateTokenRequestBody'
                        example:
                            audience: insights
                            expiration: 90d
                            name: ci-pipeline
            responses:
                "201":
                    description: Created response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateTokenResponseBody'
                            example:
                                secret: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                                token:
                                    audience: insights
                                    created_at: "2026-09-21T12:00:00Z"
                                    expires_at: "2026-12-20T12:00:00Z"
                                    last_used_at: "2026-09-22T08:30:00Z"
                                    lookup_id: Ab3kZ9QmT2xL
                                    name: ci-pipeline
                                    uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                                    username: jdoe
                "400":
                    description: 'BadRequest: Invalid name or expiration, or unknown or disabled audience'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BadRequestError'
                            example:
                                error: invalid_request
                                message: value of version must be one of "1" but got value "2"
                "401":
                    description: 'Unauthorized: Missing, invalid or anonymous bearer token'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedError'
                            example:
                                error: unauthorized
                                message: missing bearer token
                "403":
                    description: 'Forbidden: Principal is not allowed to call this endpoint'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenError'
                            example:
                                error: forbidden
                                message: machine principals cannot manage personal access tokens
                "409":
                    description: 'Conflict: Name already used, or active-token limit reached, for this audience'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConflictError'
                            example:
                                error: token_name_taken
                                message: a token named "ci-pipeline" already exists for audience insights
                "500":
                    description: 'InternalServerError: Internal server error'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InternalError'
                            example:
                                error: internal_error
                                message: internal service error
                "503":
                    description: 'ServiceUnavailable: Service unavailable'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ServiceUnavailableError'
                            example:
                                error: service_unavailable
                                message: the service is unavailable
            security:
                - jwt_header_Authorization: []
    /tokens/{uid}:
        delete:
            tags:
                - lfx_v2_pat_service
            summary: delete-token lfx_v2_pat_service
            description: Revoke one of the caller's tokens. The row is kept for audit; later reads return 404 and validation fails.
            operationId: lfx_v2_pat_service#delete-token
            parameters:
                - name: v
                  in: query
                  description: Version of the API
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Version of the API
                    example: "1"
                    enum:
                        - "1"
                  example: "1"
                - name: uid
                  in: path
                  description: Token UID
                  required: true
                  schema:
                    type: string
                    description: Token UID
                    example: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                    format: uuid
                  example: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
            responses:
                "204":
                    description: No Content response.
                "400":
                    description: 'BadRequest: uid is not a UUID'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BadRequestError'
                            example:
                                error: invalid_request
                                message: value of version must be one of "1" but got value "2"
                "401":
                    description: 'Unauthorized: Missing, invalid or anonymous bearer token'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedError'
                            example:
                                error: unauthorized
                                message: missing bearer token
                "403":
                    description: 'Forbidden: Principal is not allowed to call this endpoint'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenError'
                            example:
                                error: forbidden
                                message: machine principals cannot manage personal access tokens
                "404":
                    description: 'NotFound: No active token with this uid is owned by the caller'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NotFoundError'
                            example:
                                error: token_not_found
                                message: no active token with this uid
                "500":
                    description: 'InternalServerError: Internal server error'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InternalError'
                            example:
                                error: internal_error
                                message: internal service error
                "503":
                    description: 'ServiceUnavailable: Service unavailable'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ServiceUnavailableError'
                            example:
                                error: service_unavailable
                                message: the service is unavailable
            security:
                - jwt_header_Authorization: []
components:
    schemas:
        BadRequestError:
            type: object
            properties:
                error:
                    type: string
                    description: Stable machine-readable code
                    example: invalid_request
                    enum:
                        - invalid_request
                        - invalid_name
                        - invalid_expiration
                        - invalid_uid
                        - unknown_audience
                message:
                    type: string
                    description: Human-readable explanation
                    example: value of version must be one of "1" but got value "2"
            description: The request is invalid
            example:
                error: invalid_request
                message: value of version must be one of "1" but got value "2"
            required:
                - error
                - message
        ConflictError:
            type: object
            properties:
                error:
                    type: string
                    description: Stable machine-readable code
                    example: token_name_taken
                    enum:
                        - token_name_taken
                        - token_limit_reached
                message:
                    type: string
                    description: Human-readable explanation
                    example: a token named "ci-pipeline" already exists for audience insights
            description: Name already used, or active-token limit reached, for this audience
            example:
                error: token_name_taken
                message: a token named "ci-pipeline" already exists for audience insights
            required:
                - error
                - message
        CreateTokenRequestBody:
            type: object
            properties:
                audience:
                    type: string
                    description: Audience to mint the token for
                    example: insights
                    pattern: ^[a-z][a-z0-9-]{1,31}$
                expiration:
                    type: string
                    description: How long the token stays valid, counted from creation; none never expires
                    default: none
                    example: 90d
                    enum:
                        - 30d
                        - 60d
                        - 90d
                        - 1y
                        - none
                name:
                    type: string
                    description: Display name, unique (case-insensitive) among the caller's active tokens for the audience
                    example: ci-pipeline
                    minLength: 1
                    maxLength: 100
            example:
                audience: insights
                expiration: 90d
                name: ci-pipeline
            required:
                - name
                - audience
        CreateTokenResponseBody:
            type: object
            properties:
                secret:
                    type: string
                    description: Plaintext secret. Shown once; store it now.
                    example: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                token:
                    $ref: '#/components/schemas/TokenResponse'
            example:
                secret: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                token:
                    audience: insights
                    created_at: "2026-09-21T12:00:00Z"
                    expires_at: "2026-12-20T12:00:00Z"
                    last_used_at: "2026-09-22T08:30:00Z"
                    lookup_id: Ab3kZ9QmT2xL
                    name: ci-pipeline
                    uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                    username: jdoe
            required:
                - secret
                - token
        ForbiddenError:
            type: object
            properties:
                error:
                    type: string
                    description: Stable machine-readable code
                    example: forbidden
                    enum:
                        - forbidden
                message:
                    type: string
                    description: Human-readable explanation
                    example: machine principals cannot manage personal access tokens
            description: Principal is not allowed to call this endpoint
            example:
                error: forbidden
                message: machine principals cannot manage personal access tokens
            required:
                - error
                - message
        InternalError:
            type: object
            properties:
                error:
                    type: string
                    description: Stable machine-readable code
                    example: internal_error
                    enum:
                        - internal_error
                message:
                    type: string
                    description: Human-readable explanation
                    example: internal service error
            description: Internal server error
            example:
                error: internal_error
                message: internal service error
            required:
                - error
                - message
        InvalidTokenError:
            type: object
            properties:
                error:
                    type: string
                    description: Stable machine-readable code
                    example: invalid_token
                    enum:
                        - invalid_token
                message:
                    type: string
                    description: Human-readable explanation
                    example: secret is invalid, expired or revoked
            description: Secret is invalid, expired or revoked
            example:
                error: invalid_token
                message: secret is invalid, expired or revoked
            required:
                - error
                - message
        ListTokensResponseBody:
            type: object
            properties:
                tokens:
                    type: array
                    items:
                        $ref: '#/components/schemas/TokenResponse'
                    description: Active tokens owned by the caller
                    example:
                        - audience: insights
                          created_at: "2026-09-21T12:00:00Z"
                          expires_at: "2026-12-20T12:00:00Z"
                          last_used_at: "2026-09-22T08:30:00Z"
                          lookup_id: Ab3kZ9QmT2xL
                          name: ci-pipeline
                          uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                          username: jdoe
                        - audience: insights
                          created_at: "2026-09-21T12:00:00Z"
                          expires_at: "2026-12-20T12:00:00Z"
                          last_used_at: "2026-09-22T08:30:00Z"
                          lookup_id: Ab3kZ9QmT2xL
                          name: ci-pipeline
                          uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                          username: jdoe
                        - audience: insights
                          created_at: "2026-09-21T12:00:00Z"
                          expires_at: "2026-12-20T12:00:00Z"
                          last_used_at: "2026-09-22T08:30:00Z"
                          lookup_id: Ab3kZ9QmT2xL
                          name: ci-pipeline
                          uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                          username: jdoe
                        - audience: insights
                          created_at: "2026-09-21T12:00:00Z"
                          expires_at: "2026-12-20T12:00:00Z"
                          last_used_at: "2026-09-22T08:30:00Z"
                          lookup_id: Ab3kZ9QmT2xL
                          name: ci-pipeline
                          uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                          username: jdoe
            example:
                tokens:
                    - audience: insights
                      created_at: "2026-09-21T12:00:00Z"
                      expires_at: "2026-12-20T12:00:00Z"
                      last_used_at: "2026-09-22T08:30:00Z"
                      lookup_id: Ab3kZ9QmT2xL
                      name: ci-pipeline
                      uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                      username: jdoe
                    - audience: insights
                      created_at: "2026-09-21T12:00:00Z"
                      expires_at: "2026-12-20T12:00:00Z"
                      last_used_at: "2026-09-22T08:30:00Z"
                      lookup_id: Ab3kZ9QmT2xL
                      name: ci-pipeline
                      uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                      username: jdoe
            required:
                - tokens
        NotFoundError:
            type: object
            properties:
                error:
                    type: string
                    description: Stable machine-readable code
                    example: token_not_found
                    enum:
                        - token_not_found
                message:
                    type: string
                    description: Human-readable explanation
                    example: no active token with this uid
            description: No active token with this uid is owned by the caller
            example:
                error: token_not_found
                message: no active token with this uid
            required:
                - error
                - message
        ServiceUnavailableError:
            type: object
            properties:
                error:
                    type: string
                    description: Stable machine-readable code
                    example: service_unavailable
                    enum:
                        - service_unavailable
                message:
                    type: string
                    description: Human-readable explanation
                    example: the service is unavailable
            description: Service unavailable
            example:
                error: service_unavailable
                message: the service is unavailable
            required:
                - error
                - message
        TokenIdentity:
            type: object
            properties:
                audience:
                    type: string
                    description: Audience the token was minted for. The caller must compare it with the audience it expects.
                    example: insights
                    pattern: ^[a-z][a-z0-9-]{1,31}$
                email:
                    type: string
                    description: Owner email captured at issuance, when the user JWT carried a verified one
                    example: jdoe@example.com
                    format: email
                uid:
                    type: string
                    description: Token UID
                    example: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                    format: uuid
                username:
                    type: string
                    description: Owner LFID username
                    example: jdoe
            description: Owner identity resolved from a secret
            example:
                audience: insights
                email: jdoe@example.com
                uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                username: jdoe
            required:
                - uid
                - username
                - audience
        TokenResponse:
            type: object
            properties:
                audience:
                    type: string
                    description: Audience the token was minted for
                    example: insights
                    pattern: ^[a-z][a-z0-9-]{1,31}$
                created_at:
                    type: string
                    description: Creation time
                    example: "2026-09-21T12:00:00Z"
                    format: date-time
                expires_at:
                    type: string
                    description: Time the token stops validating; absent when it never expires
                    example: "2026-12-20T12:00:00Z"
                    format: date-time
                last_used_at:
                    type: string
                    description: Time of the last successful validation; absent until first use
                    example: "2026-09-22T08:30:00Z"
                    format: date-time
                lookup_id:
                    type: string
                    description: Public locator embedded in the secret; safe to display
                    example: Ab3kZ9QmT2xL
                    minLength: 12
                    maxLength: 12
                name:
                    type: string
                    description: Display name, unique (case-insensitive) among the caller's active tokens for the audience
                    example: ci-pipeline
                    minLength: 1
                    maxLength: 100
                uid:
                    type: string
                    description: Token UID
                    example: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                    format: uuid
                username:
                    type: string
                    description: Owner LFID username
                    example: jdoe
            description: A personal access token as seen by its owner. The secret is only returned at creation.
            example:
                audience: insights
                created_at: "2026-09-21T12:00:00Z"
                expires_at: "2026-12-20T12:00:00Z"
                last_used_at: "2026-09-22T08:30:00Z"
                lookup_id: Ab3kZ9QmT2xL
                name: ci-pipeline
                uid: 8d4c5a2e-3b1f-4c6d-9e7a-1f2b3c4d5e6f
                username: jdoe
            required:
                - uid
                - name
                - audience
                - lookup_id
                - username
                - created_at
        UnauthorizedError:
            type: object
            properties:
                error:
                    type: string
                    description: Stable machine-readable code
                    example: unauthorized
                    enum:
                        - unauthorized
                message:
                    type: string
                    description: Human-readable explanation
                    example: missing bearer token
            description: Missing, invalid or anonymous bearer token
            example:
                error: unauthorized
                message: missing bearer token
            required:
                - error
                - message
        ValidateTokenRequestBody:
            type: object
            properties:
                secret:
                    type: string
                    description: Opaque secret presented by the end user
                    example: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                    minLength: 1
                    maxLength: 128
            example:
                secret: lfi_aaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            required:
                - secret
    securitySchemes:
        jwt_header_Authorization:
            type: http
            description: Heimdall authorization
            scheme: bearer
